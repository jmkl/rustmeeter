[package]
name = "rustmeeter"
version = "0.1.0"
edition = "2024"

[dependencies]
rustmeeter-core = { path = "../rustmeeter-core", features = ["serde"] }
anyhow = "1"
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-canvas = { path = "../../../windows-rs/crates/libs/canvas", default-features = false, features = ["reactor"] }
windows-reactor = { path = "../../../windows-rs/crates/libs/reactor" }
windows-text = { path = "../../../windows-rs/crates/libs/text" }
windows-core = { path = "../../../windows-rs/crates/libs/core" }

[features]
default = ["cactus"]
cactus = ["rustmeeter-core/cactus"]


[build-dependencies]
winres = "0.1"