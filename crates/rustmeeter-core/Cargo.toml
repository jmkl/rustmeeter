[package]
name = "rustmeeter-core"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.15"
ringbuf = "0.3"
biquad = "0.4"
anyhow = "1"
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cactus-core = { path = "../cactus-core", optional = true }

[features]
default = ["cactus"]
cactus = ["dep:cactus-core"]
# Kept for compatibility with older build scripts; serde is always available now because the
# settings file and the IPC API are part of the core crate.
serde = []

[lib]
name = "rustmeeter_core"
path = "src/lib.rs"
